# 🔗 Links:
# Source file: https://github.com/obytes/react-native-template-obytes/blob/master/.github/actions/setup-jdk-generate-apk/action.yml
# Composite actions docs: https://docs.github.com/en/actions/creating-actions/creating-a-composite-action

# ✍️ Description:
# This is a composite action, which means it can be used in other actions.
# This action is used to set up the JDK environment and generate an Android APK for testing.
# This action accepts one input: `APP_ENV`, which is used to generate an APK for a specific environment (development, preview, production). We use preview by default.
# Before generating the APK, we run a pre-build script to generate the necessary native folders based on the APP_ENV.
# On success, the APK is generated at `./android/app/build/outputs/apk/release/app-release.apk`.

# 👀 Example usage:
#       - name : 📦 Set Up JDK + Generate Test APK
#         uses: ./.github/actions/setup-jdk-generate-apk
#         with:
#           APP_ENV: 'preview'

name: 'Setup  JDK + GRADLE + Generate APK'
description: 'Setup  JDK + GRADLE + Generate APK'
inputs:
  APP_ENV:
    description: 'APP_ENV (one of): development, preview, production'
    required: true
    default: preview
  EXPO_PUBLIC_API_URL:
    description: API base URL. env.ts validates it as a URL and prebuild refuses to run without one. No default - an absent value should stop the build, not build against a placeholder.
    required: true

runs:
  using: composite
  steps:
    - name: Set Up JDK
      uses: actions/setup-java@v6
      with:
        distribution: zulu # See 'Supported distributions' for available options
        java-version: '17'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Generate Test APK
      run: |
        pnpm prebuild:${{ inputs.APP_ENV }}
        cd  android
        chmod +x ./gradlew
        ./gradlew assembleRelease --no-daemon
        cd ..
      shell: bash
      env:
        EXPO_NO_DOTENV: '1'
        APP_ENV: ${{ inputs.APP_ENV }}
        CI: 'true'
        # There is no committed .env, by design, and EXPO_NO_DOTENV stops Expo
        # looking for one. Every other variable env.ts needs is derived in code;
        # this is the only one that has to arrive from the environment.
        EXPO_PUBLIC_API_URL: ${{ inputs.EXPO_PUBLIC_API_URL }}
