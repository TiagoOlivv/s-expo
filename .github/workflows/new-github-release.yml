# 🔗 Links:
# Source file: https://github.com/obytes/react-native-template-obytes/blob/master/.github/workflows/new-github-release.yml
# Starter releasing process: https://starter.obytes.com/ci-cd/app-releasing-process/

# ✍️ Description:
# This workflow will be triggered automatically after the new app version workflow has been executed successfully.
# It will create a new GitHub release with the new app version and the release notes.

# 🚨 GITHUB SECRETS REQUIRED:
#         - GH_TOKEN: a token with Contents write access.
#           A release created with the automatic GITHUB_TOKEN does not trigger
#           anything either, so eas-build-qa.yml - which listens for a published
#           release - would never wake up. The release appears, correctly, and
#           the chain silently ends there.

name: New GitHub Release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    name: New GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📦 Checkout project repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🏃‍♂️Create A Draft Github Release
        uses: ncipollo/release-action@v1
        with:
          # Not github.token, which is what this action defaults to. Nothing
          # done with GITHUB_TOKEN triggers another workflow, and a published
          # release is exactly the event eas-build-qa.yml is waiting for.
          token: ${{ secrets.GH_TOKEN }}
          generateReleaseNotes: true
          draft: false
