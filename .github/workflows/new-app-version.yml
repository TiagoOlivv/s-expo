# 🔗 Links:
# Source file: https://github.com/obytes/react-native-template-obytes/blob/master/.github/workflows/lint-ts.yml
# Starter releasing process: https://starter.obytes.com/ci-cd/app-releasing-process/

# ✍️ Description:
# Opens the pull request that raises the app version. Run it by hand from the
# Actions tab and pick patch, minor or major.
#
# It does not write to main. `main` is protected by a ruleset that requires a
# pull request, with no bypass actors, and a release is a change to main like
# any other - so it goes through the same door. The tag is created by
# tag-release.yml once the pull request is merged.
#
# The version in package.json is the only place the app version lives: env.ts
# reads it into EXPO_PUBLIC_VERSION and app.config.ts reads that. Nothing else
# needs to move, and there is no native code in the repository to align, since
# ios/ and android/ are generated.

# 🚨 GITHUB SECRETS REQUIRED:
#         - GH_TOKEN: a token with Contents and Pull requests write access.
#           A pull request opened with the automatic GITHUB_TOKEN does not
#           trigger other workflows, so the release PR would arrive with no
#           checks on it. https://github.com/settings/personal-access-tokens

name: New App Version

on:
  workflow_dispatch:
    inputs:
      release-type:
        type: choice
        description: 'Release type (one of): patch, minor, major'
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

jobs:
  release:
    name: Open the version bump pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 📦 Checkout project repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 📦 Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: 🔢 Bump the version
        id: bump
        run: |
          pnpm version ${{ github.event.inputs.release-type }} --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 🔀 Open the pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GH_TOKEN }}
          branch: chore/release-v${{ steps.bump.outputs.version }}
          title: 'chore(release): v${{ steps.bump.outputs.version }}'
          commit-message: 'chore(release): v${{ steps.bump.outputs.version }}'
          body: |
            Raises the app version to `v${{ steps.bump.outputs.version }}` (${{ github.event.inputs.release-type }}).

            `package.json` is the only file that changes. `env.ts` reads the version from it and `app.config.ts` reads that, so the app, the build and the store listing all follow from this one line.

            Merging this tags `v${{ steps.bump.outputs.version }}`, which publishes a GitHub release, which starts the EAS QA build.
          delete-branch: true
