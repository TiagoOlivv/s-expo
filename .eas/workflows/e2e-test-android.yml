name: e2e-test-android

# Builds an APK with the dedicated e2e-test profile and runs the Maestro flows
# against it on EAS infrastructure.
#
# This costs EAS build credits on every pull request. If that becomes a problem,
# switch the trigger to `pull_request_labeled` or drop `on` entirely and run it
# by hand with `eas workflow:run .eas/workflows/e2e-test-android.yml`.

on:
  pull_request:
    branches: [main]

jobs:
  build_android_for_e2e:
    name: Build Android APK for E2E
    type: build
    params:
      platform: android
      profile: e2e-test

  maestro_test:
    name: Run Maestro flows
    needs: [build_android_for_e2e]
    type: maestro
    params:
      build_id: ${{ needs.build_android_for_e2e.outputs.build_id }}
      flow_path: [.maestro/app/home.yaml]
