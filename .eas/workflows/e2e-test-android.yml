name: e2e-test-android

# Builds an APK with the dedicated e2e-test profile and runs the Maestro flows
# against it on EAS infrastructure.
#
# There is no automatic trigger on purpose: every run spends EAS build credits,
# and this project has no EAS project configured yet. Run it by hand with
#
#   eas workflow:run .eas/workflows/e2e-test-android.yml
#
# To run it on every pull request instead, add:
#
#   on:
#     pull_request:
#       branches: [main]

jobs:
  build_android_for_e2e:
    name: Build Android APK for E2E
    type: build
    params:
      platform: android
      profile: e2e-test

  maestro_test:
    name: Run Maestro flows
    needs: [build_android_for_e2e]
    type: maestro
    params:
      build_id: ${{ needs.build_android_for_e2e.outputs.build_id }}
      flow_path: [.maestro/app/home.yaml]
