# The app id is fixed here rather than injected, because the EAS maestro job
# does not pass -e APP_ID. Every runner - local, GitHub Actions and EAS - builds
# the development variant so this one value is correct everywhere. Change it
# together with BUNDLE_IDS/PACKAGES in env.ts.
appId: com.sexpo.app.development
---
# Smoke test: the start screen renders and every control is reachable.
#
# Nothing here depends on the stored theme or language. Those belong to
# theme.yaml and language.yaml, which normalise the state themselves - see the
# comment in either one for why clearState is not used.
- launchApp

# The avatar is fetched from github.com. Its element is in the hierarchy either
# way - what a failed request costs is the picture, not the node - so this
# assertion says the screen wired it up, not that the network answered.
- assertVisible:
    id: home-avatar

- assertVisible:
    id: home-handle
    text: '@tiagoolivv'

- assertVisible:
    id: home-title
    text: SExpo Starter

- assertVisible:
    id: home-description

- assertVisible:
    id: theme-button

- assertVisible:
    id: language-button
